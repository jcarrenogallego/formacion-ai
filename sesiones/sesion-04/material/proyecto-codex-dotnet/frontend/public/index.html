<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <span class="eyebrow">Panel del equipo</span>
      <h1>Delivery Board</h1>
      <p>Una vista sencilla del trabajo que está moviendo el equipo.</p>
    </div>
    <div class="live"><span></span> Sistema activo</div>
  </header>

  <main>
    <section class="metrics" aria-label="Resumen">
      <article><span>Total</span><strong id="total">0</strong></article>
      <article><span>Pendientes</span><strong id="pending">0</strong></article>
      <article><span>En curso</span><strong id="in-progress">0</strong></article>
      <article><span>Completadas</span><strong id="completed">0</strong></article>
    </section>

    <section class="layout">
      <article class="panel">
        <div class="panel-title">
          <div><span class="eyebrow">Actividad</span><h2>Trabajo reciente</h2></div>
          <button id="refresh" class="secondary">Actualizar</button>
        </div>
        <div id="work-items" class="work-items"></div>
      </article>

      <aside class="panel">
        <span class="eyebrow">Nueva tarea</span>
        <h2>Añadir al tablero</h2>
        <form id="work-item-form">
          <label>Título<input name="title" maxlength="160" required placeholder="Ej. Revisar integración"></label>
          <label>Responsable<input name="owner" maxlength="80" required placeholder="Nombre del responsable"></label>
          <label>Prioridad
            <select name="priority">
              <option value="Low">Baja</option>
              <option value="Medium" selected>Media</option>
              <option value="High">Alta</option>
            </select>
          </label>
          <button type="submit">Crear tarea</button>
          <p id="message" role="status"></p>
        </form>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
